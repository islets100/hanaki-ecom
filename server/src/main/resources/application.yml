server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hanaki-ecom-agent
  ai:
    # 不提供密钥时应用会在启动阶段明确失败，避免误以为正在调用真实模型。
    model:
      chat: dashscope
      embedding: dashscope
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: ${AI_CHAT_TEMPERATURE:0.2}
          max-tokens: ${AI_CHAT_MAX_TOKENS:1200}
          enable-search: false
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:512}
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 3s
  servlet:
    multipart:
      max-file-size: ${REFUND_MAX_FILE_SIZE:100MB}
      max-request-size: ${REFUND_MAX_REQUEST_SIZE:220MB}
  datasource:
    # 本地演示只运行一个后端进程，使用直接文件模式更稳定。AUTO_SERVER 会把锁文件绑定到
    # 随机 TCP 端口，进程异常结束或电脑网络地址变化后可能留下无法连接的旧端口。
    url: ${DATABASE_URL:jdbc:h2:file:./data/hanaki;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8

management:
  metrics:
    distribution:
      percentiles-histogram:
        agent.model.duration: true
        agent.node.duration: true
        agent.run.duration: true
        agent.tool.duration: true
        agent.rag.duration: true
        agent.evaluation.duration: true
        agent.evaluation.candidate.duration: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

agent:
  refund:
    evidence-dir: ${REFUND_EVIDENCE_DIR:./data/refund-evidence}
    max-files: ${REFUND_MAX_FILES:4}
    max-image-bytes: ${REFUND_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${REFUND_MAX_VIDEO_BYTES:104857600}
    auto-approve-threshold: ${REFUND_AUTO_APPROVE_THRESHOLD:80}
    assessment-model: ${AI_CHAT_MODEL:qwen-plus}
  business-task:
    timeout-scan-ms: ${AGENT_BUSINESS_TASK_TIMEOUT_SCAN_MS:60000}
  request-dedup:
    lease-seconds: ${AGENT_REQUEST_LEASE_SECONDS:300}
    duplicate-wait-seconds: ${AGENT_REQUEST_DUPLICATE_WAIT_SECONDS:35}
  checkpoint:
    directory: ${AGENT_CHECKPOINT_DIRECTORY:./data/graph-checkpoints}
    graph-version: ${AGENT_GRAPH_VERSION:customer-service-graph-v3}
    completed-retention-hours: ${AGENT_CHECKPOINT_COMPLETED_RETENTION_HOURS:24}
  observability:
    service-name: hanaki-ecom-agent
    app-version: ${APP_VERSION:1.0.0}
    environment: ${APP_ENVIRONMENT:local}
    # 使用标准 OTLP/HTTP JSON 协议直接发往 OpenTelemetry Collector，无需绑定厂商 SDK。
    otlp-enabled: ${OTEL_EXPORT_ENABLED:false}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    model-name: ${AI_CHAT_MODEL:qwen-plus}
    prompt-version: ${AGENT_PROMPT_VERSION:2026-08-01}
    # qwen-plus 中国内地、单次输入不超过 128K 的每百万 Token 列表价；可按模型覆盖。
    input-cost-per-million-cny: ${AI_INPUT_COST_PER_MILLION_CNY:0.8}
    output-cost-per-million-cny: ${AI_OUTPUT_COST_PER_MILLION_CNY:2.0}
    payload-limit: ${OBSERVABILITY_PAYLOAD_LIMIT:4000}
    export-queue-capacity: ${OTEL_EXPORT_QUEUE_CAPACITY:2048}
    export-batch-size: ${OTEL_EXPORT_BATCH_SIZE:128}
  routing:
    high-confidence: 0.82
    medium-confidence: 0.55
  # 这些值会在每次 Run 初始化时冻结到可信上下文与轻量 Checkpoint。
  # 租户表可以发布更窄的业务配置，但不能覆盖平台安全规则或工具白名单。
  config:
    policy-version: ${AGENT_POLICY_VERSION:policy-v1}
    knowledge-base-version: ${AGENT_KNOWLEDGE_BASE_VERSION:knowledge-v1}
    tool-schema-version: ${AGENT_TOOL_SCHEMA_VERSION:tool-schema-v3}
    routing-version: ${AGENT_ROUTING_VERSION:routing-v1}
    topology-version: ${AGENT_TOPOLOGY_VERSION:standard-v1}
  memory:
    conversation:
      # 最近窗口最终由 Token 上限控制，条数只作为数据库/Redis 回源的扫描上限。
      recent-messages: ${AGENT_MEMORY_RECENT_MESSAGES:8}
      main-recent-messages: ${AGENT_MEMORY_MAIN_RECENT_MESSAGES:4}
      max-window-tokens: ${AGENT_MEMORY_MAX_WINDOW_TOKENS:6000}
      max-message-count: ${AGENT_MEMORY_MAX_MESSAGE_COUNT:20}
      summarize-batch-size: ${AGENT_MEMORY_SUMMARIZE_BATCH_SIZE:10}
      # 每次摘要后仍保留末尾热消息原文，防止刚发生的语义被压缩损失。
      retain-unsummarized-messages: ${AGENT_MEMORY_RETAIN_UNSUMMARIZED_MESSAGES:8}
      hot-window-ttl-days: ${AGENT_MEMORY_HOT_WINDOW_TTL_DAYS:3}
      # Redis lease 只减少重复摘要计算；数据库 version + covered_end_seq CAS 才保证正确性。
      summary-lease-seconds: ${AGENT_MEMORY_SUMMARY_LEASE_SECONDS:30}
    context:
      max-total-memory-tokens: ${AGENT_MEMORY_MAX_TOTAL_TOKENS:2000}
      max-recent-message-tokens: ${AGENT_MEMORY_MAX_RECENT_TOKENS:900}
      max-summary-tokens: ${AGENT_MEMORY_MAX_SUMMARY_TOKENS:450}
      max-episodic-tokens: ${AGENT_MEMORY_MAX_EPISODIC_TOKENS:450}
      max-profile-tokens: ${AGENT_MEMORY_MAX_PROFILE_TOKENS:250}
      max-single-memory-tokens: ${AGENT_MEMORY_MAX_SINGLE_TOKENS:240}
    expiration:
      # 只迁移生命周期状态，不在在线任务中直接物理删除审计数据。
      scan-millis: ${AGENT_MEMORY_EXPIRATION_SCAN_MILLIS:60000}
    elasticsearch:
      enabled: ${AGENT_MEMORY_ELASTICSEARCH_ENABLED:${AGENT_ELASTICSEARCH_ENABLED:false}}
      url: ${AGENT_MEMORY_ELASTICSEARCH_URL:${AGENT_ELASTICSEARCH_URL:http://localhost:9200}}
      # v2 mapping 增加 agentType/trustLevel/promptEligibleUntil 的检索前过滤字段。
      index: ${AGENT_MEMORY_ELASTICSEARCH_INDEX:hanaki-memory-v2}
      timeout-seconds: ${AGENT_MEMORY_ELASTICSEARCH_TIMEOUT_SECONDS:5}
  context:
    # 实际输入预算 = min(显式上限, 模型窗口 - 输出预留 - 安全余量)。
    max-prompt-tokens: ${AGENT_MAX_PROMPT_TOKENS:6000}
    model-context-window: ${AGENT_MODEL_CONTEXT_WINDOW:8192}
    output-reserve-tokens: ${AGENT_OUTPUT_RESERVE_TOKENS:1200}
    safety-margin-tokens: ${AGENT_CONTEXT_SAFETY_MARGIN_TOKENS:800}
  cache:
    # 这些开关支持先停读、保留写入观察，或仅关闭 stale/最终回答缓存，不需要清空 Redis。
    reads-enabled: ${AGENT_CACHE_READS_ENABLED:true}
    writes-enabled: ${AGENT_CACHE_WRITES_ENABLED:true}
    disable-stale: ${AGENT_CACHE_DISABLE_STALE:false}
    disable-final-answer: ${AGENT_CACHE_DISABLE_FINAL_ANSWER:true}
    l1:
      enabled: ${AGENT_CACHE_L1_ENABLED:true}
      maximum-weight-bytes: ${AGENT_CACHE_L1_MAXIMUM_WEIGHT_BYTES:67108864}
    l2:
      enabled: ${AGENT_CACHE_L2_ENABLED:true}
    redis:
      # 开启后使用 Redis 作为跨实例 L2；不可用时熔断并降级到安全 L1/真实数据源。
      enabled: ${AGENT_REDIS_ENABLED:false}
      host: ${AGENT_REDIS_HOST:localhost}
      port: ${AGENT_REDIS_PORT:6379}
      password: ${AGENT_REDIS_PASSWORD:}
      database: ${AGENT_REDIS_DATABASE:0}
      timeout-millis: ${AGENT_REDIS_TIMEOUT_MILLIS:1500}
      invalidation-channel: ${AGENT_REDIS_INVALIDATION_CHANNEL:hanaki:cache:invalidate}
      circuit-failure-threshold: ${AGENT_REDIS_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-cooldown-millis: ${AGENT_REDIS_CIRCUIT_COOLDOWN_MILLIS:10000}
  rag:
    # 整条链路的审计版本。路由、过滤或排名参数有语义变化时应升级，避免旧缓存混入新策略。
    config-version: ${AGENT_RAG_CONFIG_VERSION:rag-v1}
    policy-version: ${AGENT_RAG_POLICY_VERSION:policy-v1}
    # 旧属性保留给兼容入口；新 Business Agent 子图使用下面各阶段的独立配置。
    top-k: ${AGENT_RAG_TOP_K:6}
    rrf-k: ${AGENT_RAG_RRF_K:60}
    rewrite:
      version: ${AGENT_RAG_REWRITE_VERSION:structured-rewrite-v1}
      timeout-millis: ${AGENT_RAG_REWRITE_TIMEOUT_MILLIS:4500}
      # 当前实现只允许一次确定性修复：补回受保护实体、修剪长度并重建 lexical/semantic query。
      maximum-repair-attempts: 1
    recall:
      # BM25 与向量分支独立超时；其中一路超时不会取消另一路的有效候选。
      branch-timeout-millis: ${AGENT_RAG_RECALL_BRANCH_TIMEOUT_MILLIS:4500}
      lexical-top-k: ${AGENT_RAG_LEXICAL_TOP_K:40}
      vector-top-k: ${AGENT_RAG_VECTOR_TOP_K:40}
      vector-num-candidates: ${AGENT_RAG_VECTOR_NUM_CANDIDATES:160}
    fusion:
      version: ${AGENT_RAG_FUSION_VERSION:weighted-rrf-v1}
      rrf-k: ${AGENT_RAG_RRF_K:60}
      top-k: ${AGENT_RAG_FUSION_TOP_K:30}
      lexical-weight: ${AGENT_RAG_LEXICAL_WEIGHT:1.0}
      vector-weight: ${AGENT_RAG_VECTOR_WEIGHT:1.0}
      rule-weight: ${AGENT_RAG_RULE_WEIGHT:1.15}
      business-weight: ${AGENT_RAG_BUSINESS_WEIGHT:1.20}
    evidence:
      # RRF 回退分数约为 1/(k+rank) 的数量级，因此默认阈值不使用远程 rerank 的 0~1 假设。
      minimum-score: ${AGENT_RAG_EVIDENCE_MINIMUM_SCORE:0.01}
      minimum-sub-question-coverage: ${AGENT_RAG_MINIMUM_SUBQUESTION_COVERAGE:0.25}
    rerank:
      enabled: ${AGENT_RERANK_ENABLED:false}
      endpoint: ${AGENT_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      model: ${AGENT_RERANK_MODEL:qwen3-rerank}
      timeout-seconds: ${AGENT_RERANK_TIMEOUT_SECONDS:8}
      input-top-n: ${AGENT_RERANK_INPUT_TOP_N:30}
      output-top-k: ${AGENT_RERANK_OUTPUT_TOP_K:6}
      maximum-documents: ${AGENT_RERANK_MAXIMUM_DOCUMENTS:30}
      maximum-document-chars: ${AGENT_RERANK_MAXIMUM_DOCUMENT_CHARS:6000}
      maximum-query-chars: ${AGENT_RERANK_MAXIMUM_QUERY_CHARS:2000}
    elasticsearch:
      enabled: ${AGENT_ELASTICSEARCH_ENABLED:false}
      url: ${AGENT_ELASTICSEARCH_URL:http://localhost:9200}
      # 业务读取只走 read-alias；physical-index 可按 mapping/embedding 版本新建后原子切换别名。
      index-version: ${AGENT_ELASTICSEARCH_INDEX_VERSION:knowledge-v1}
      physical-index: ${AGENT_ELASTICSEARCH_PHYSICAL_INDEX:hanaki-knowledge-v1}
      read-alias: ${AGENT_ELASTICSEARCH_READ_ALIAS:hanaki-knowledge-read}
      write-alias: ${AGENT_ELASTICSEARCH_WRITE_ALIAS:hanaki-knowledge-write}
      api-key: ${AGENT_ELASTICSEARCH_API_KEY:}
      username: ${AGENT_ELASTICSEARCH_USERNAME:}
      password: ${AGENT_ELASTICSEARCH_PASSWORD:}
      timeout-seconds: ${AGENT_ELASTICSEARCH_TIMEOUT_SECONDS:5}
  judge:
    model: ${AI_JUDGE_MODEL:qwen-max}
    complex-length: 55
    minimum-score: 75
    minimum-gap: 5
    safety-veto-threshold: 80
    weights:
      factuality: 30
      evidence: 20
      completeness: 15
      business: 15
      safety: 10
      clarity: 10
    candidate-timeout-seconds: 18
  evaluation:
    enabled: ${AGENT_EVALUATION_ENABLED:true}
    complex-length: ${AGENT_EVALUATION_COMPLEX_LENGTH:55}
    candidate-count: 3
    minimum-successful-candidates: 2
    max-candidate-attempts: 2
    max-judge-attempts: 2
    similarity-threshold: 0.92
    timeout:
      candidate-seconds: ${AGENT_EVALUATION_CANDIDATE_TIMEOUT_SECONDS:8}
      judge-seconds: ${AGENT_EVALUATION_JUDGE_TIMEOUT_SECONDS:5}
      batch-seconds: ${AGENT_EVALUATION_BATCH_TIMEOUT_SECONDS:15}
    budget:
      max-batch-prompt-tokens: ${AGENT_EVALUATION_MAX_BATCH_PROMPT_TOKENS:18000}
      max-batch-completion-tokens: ${AGENT_EVALUATION_MAX_BATCH_COMPLETION_TOKENS:6000}
      max-tenant-daily-tokens: ${AGENT_EVALUATION_MAX_TENANT_DAILY_TOKENS:2000000}
    concurrency:
      max-batches-per-tenant: ${AGENT_EVALUATION_MAX_TENANT_BATCHES:3}
      max-global-batches: ${AGENT_EVALUATION_MAX_GLOBAL_BATCHES:20}
      max-global-candidates: ${AGENT_EVALUATION_MAX_GLOBAL_CANDIDATES:40}
      executor-core-size: ${AGENT_EVALUATION_EXECUTOR_CORE_SIZE:16}
      executor-max-size: ${AGENT_EVALUATION_EXECUTOR_MAX_SIZE:32}
      executor-queue-capacity: ${AGENT_EVALUATION_EXECUTOR_QUEUE_CAPACITY:100}
      model-core-size: ${AGENT_EVALUATION_MODEL_CORE_SIZE:16}
      model-max-size: ${AGENT_EVALUATION_MODEL_MAX_SIZE:32}
      model-queue-capacity: ${AGENT_EVALUATION_MODEL_QUEUE_CAPACITY:100}
  knowledge:
    minimum-judge-score: ${AGENT_KNOWLEDGE_MINIMUM_JUDGE_SCORE:75}
    outbox:
      poll-millis: ${AGENT_KNOWLEDGE_OUTBOX_POLL_MILLIS:1500}
      batch-size: ${AGENT_KNOWLEDGE_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${AGENT_KNOWLEDGE_OUTBOX_MAX_ATTEMPTS:5}
      lease-seconds: ${AGENT_KNOWLEDGE_OUTBOX_LEASE_SECONDS:60}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
    confirm-secret: ${CONFIRM_SECRET}
    session-hours: ${AUTH_SESSION_HOURS:24}
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:15}
    # 客户与平台官方账号使用 platform 作用域；每个入驻商家才是一个独立 SaaS 租户。
    platform-name: ${SAAS_PLATFORM_NAME:花木商城平台}
    # 创建新商家租户属于平台级操作，必须提供独立密钥；生产环境务必替换默认值。
    tenant-provisioning-key: ${SAAS_TENANT_PROVISIONING_KEY}
    # 客服注册必须持有对应邀请码，避免普通用户把自己注册成客服。
    store-agent-invite-code: ${STORE_AGENT_INVITE_CODE}
    official-agent-invite-code: ${OFFICIAL_AGENT_INVITE_CODE}

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
